<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конфигуратор ПК — PC Market</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">Главная</a> / <span>Конфигуратор</span></div>
        <h1>Конфигуратор ПК</h1>
        <p>Выберите каждый компонент и соберите идеальный компьютер</p>
      </div>
    </div>

    <div class="container configurator-layout">
      <div>
        <div class="config-steps" id="configSteps">
          <span class="config-step active">CPU</span>
          <span class="config-step">GPU</span>
          <span class="config-step">RAM</span>
          <span class="config-step">SSD</span>
          <span class="config-step">MB</span>
          <span class="config-step">PSU</span>
          <span class="config-step">COOL</span>
          <span class="config-step">CASE</span>
        </div>
        <div class="config-components" id="configComponents"></div>
      </div>

      <div class="config-summary">
        <h3>Ваша сборка</h3>
        <div class="summary-items" id="summaryItems"></div>
        <div class="summary-total">
          <span class="label">Итого</span>
          <span class="price" id="configTotal">₽0</span>
        </div>
        <button class="btn btn-primary" id="addConfigToCart" style="width:100%">Добавить сборку в корзину</button>
        <p style="text-align:center;color:var(--text-muted);font-size:0.8rem;margin-top:12px">Сборка и тестирование бесплатно</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/configurator.js"></script>
  <script>initLayout('configurator');</script>
</body>
</html>
