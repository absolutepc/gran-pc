<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — PC Market</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="productDetailContent"></main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/products.js"></script>
  <script>
    initLayout('catalog');
    try {
      if (typeof initProductDetailPage !== 'function') {
        throw new Error('Не загружен файл js/products.js');
      }
      initProductDetailPage();
    } catch (err) {
      console.error(err);
      const container = document.getElementById('productDetailContent');
      if (container) {
        container.innerHTML = `
          <div class="container pc-detail-page" style="text-align:center;padding:60px 24px">
            <h2>Не удалось загрузить страницу товара</h2>
            <p style="color:var(--text-secondary);max-width:520px;margin:12px auto 24px">
              ${err.message || err}. Убедитесь, что вы скачали последнюю версию проекта
              и открываете сайт через локальный сервер (Live Server), а не двойным кликом по HTML-файлу.
            </p>
            <a href="catalog.html" class="btn btn-primary">Вернуться в каталог</a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
