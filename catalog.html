<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — PC Market</title>
  <link rel="stylesheet" href="css/style.css">
  <style>#page-transition{position:fixed;inset:0;z-index:10000;background:#0a0e17}body.page-transition-active>:not(#page-transition){visibility:hidden}</style>
</head>
<body class="page-transition-active">
  <div id="page-transition" class="page-transition" role="status" aria-live="polite" aria-label="Загрузка">
    <div class="page-transition__inner">
      <div class="page-transition__logo"><img src="img/hero-pc.svg" alt=""></div>
      <p class="page-transition__label">Каталог</p>
      <div class="page-transition__progress" aria-hidden="true"><span class="page-transition__progress-bar"></span></div>
    </div>
  </div>
  <script src="js/transition-boot.js"></script>

  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">Главная</a> / <span>Каталог</span></div>
        <h1>Каталог товаров</h1>
        <p>Полный ассортимент комплектующих и периферии</p>
      </div>
    </div>

    <div class="container page-layout">
      <aside class="filters-sidebar">
        <h3>Фильтры</h3>
        <div class="filter-group">
          <label>Категория</label>
          <div class="filter-checkboxes" id="categoryFilters"></div>
        </div>
        <div class="filter-group">
          <label>Сокет</label>
          <div class="filter-checkboxes" id="socketFilters"></div>
        </div>
        <div class="filter-group">
          <label>Тип памяти</label>
          <div class="filter-checkboxes" id="memoryTypeFilters"></div>
        </div>
        <div class="filter-group">
          <label>PCI-E</label>
          <div class="filter-checkboxes" id="pcieFilters"></div>
        </div>
        <div class="filter-group">
          <label>Объём ОЗУ</label>
          <div class="filter-checkboxes" id="ramFilters"></div>
        </div>
        <div class="filter-group">
          <label>Размер СЖО</label>
          <div class="filter-checkboxes" id="liquidFilters"></div>
        </div>
        <div class="filter-group">
          <label>Тип БП</label>
          <div class="filter-checkboxes" id="psutypeFilters"></div>
        </div>
        <div class="filter-group">
          <label>Форм-фактор корпуса</label>
          <div class="filter-checkboxes" id="caseffFilters"></div>
        </div>
        <div class="filter-group">
          <label>Диагональ</label>
          <div class="filter-checkboxes" id="inchFilters"></div>
        </div>
        <div class="filter-group">
          <label>Матрица</label>
          <div class="filter-checkboxes" id="matrixFilters"></div>
        </div>
        <div class="filter-group">
          <label>Частота</label>
          <div class="filter-checkboxes" id="hertzFilters"></div>
        </div>
        <div class="filter-group">
          <label>Разрешение</label>
          <div class="filter-checkboxes" id="qualityFilters"></div>
        </div>
        <div class="filter-group">
          <label>Подключение</label>
          <div class="filter-checkboxes" id="wiredFilters"></div>
        </div>
        <div class="filter-group">
          <label>Цена: <span id="priceLabel">₽0 — ₽300 000</span></label>
          <input type="range" id="priceRange" min="0" max="300000" step="5000" value="300000">
        </div>
        <div class="filter-group">
          <label>Метка</label>
          <div class="filter-checkboxes">
            <label><input type="checkbox" value="new" class="badge-filter"> Новинка</label>
            <label><input type="checkbox" value="sale" class="badge-filter"> Со скидкой</label>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" id="resetFilters" style="width:100%;margin-top:8px">Сбросить фильтры</button>
      </aside>

      <div>
        <div class="catalog-toolbar">
          <span class="results-count" id="resultsCount">Найдено: 0</span>
          <select id="sortSelect">
            <option value="default">Сортировка: по умолчанию</option>
            <option value="price-asc">Цена: по возрастанию</option>
            <option value="price-desc">Цена: по убыванию</option>
            <option value="name">Название: А–Я</option>
          </select>
        </div>
        <div class="products-grid" id="catalogGrid"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js?v=7"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/transition.js"></script>
  <script>
    initLayout('catalog');

    const params = new URLSearchParams(window.location.search);

    const ATTRIBUTE_FILTERS = [
      { id: 'socketFilters', field: 'socket', options: FILTER_SOCKETS, param: 'socket', className: 'socket-filter' },
      { id: 'memoryTypeFilters', field: 'memoryType', options: FILTER_MEMORY_TYPES, param: 'memory', className: 'memory-filter' },
      { id: 'pcieFilters', field: 'pcie', options: FILTER_PCIE, param: 'pcie', className: 'pcie-filter' },
      { id: 'ramFilters', field: 'ram', options: FILTER_RAM, param: 'ram', className: 'ram-filter' },
      { id: 'liquidFilters', field: 'liquid', options: FILTER_LIQUID, param: 'liquid', className: 'liquid-filter' },
      { id: 'psutypeFilters', field: 'psutype', options: FILTER_PSUTYPE, param: 'psutype', className: 'psutype-filter' },
      { id: 'caseffFilters', field: 'caseff', options: FILTER_CASEFF, param: 'caseff', className: 'caseff-filter' },
      { id: 'inchFilters', field: 'inch', options: FILTER_INCH, param: 'inch', className: 'inch-filter' },
      { id: 'matrixFilters', field: 'matrix', options: FILTER_MATRIX, param: 'matrix', className: 'matrix-filter' },
      { id: 'hertzFilters', field: 'hertz', options: FILTER_HERTZ, param: 'hertz', className: 'hertz-filter' },
      { id: 'qualityFilters', field: 'quality', options: FILTER_QUALITY, param: 'quality', className: 'quality-filter' },
      { id: 'wiredFilters', field: 'wired', options: FILTER_WIRED, param: 'wired', className: 'wired-filter' },
    ];

    function renderFilterCheckboxes(containerId, values, cssClass, initialValue) {
      const container = document.getElementById(containerId);
      const group = container.closest('.filter-group');
      if (!values.length) {
        if (group) group.style.display = 'none';
        container.innerHTML = '';
        return;
      }
      if (group) group.style.display = '';
      container.innerHTML = values.map(value => `
        <label>
          <input type="checkbox" value="${value}" class="${cssClass}" ${initialValue === value ? 'checked' : ''}>
          ${value}
        </label>
      `).join('');
    }

    const allProducts = getProducts();
    const initialCat = params.get('cat');

    const categoryFilters = document.getElementById('categoryFilters');
    Object.entries(CATEGORY_LABELS).forEach(([key, label]) => {
      categoryFilters.innerHTML += `<label><input type="checkbox" value="${key}" class="cat-filter" ${initialCat === key ? 'checked' : ''}> ${label}</label>`;
    });

    ATTRIBUTE_FILTERS.forEach(({ id, field, options, param, className }) => {
      renderFilterCheckboxes(
        id,
        getAvailableFilterValues(allProducts, field, options),
        className,
        params.get(param)
      );
    });

    function getCheckedValues(selector) {
      return [...document.querySelectorAll(selector + ':checked')].map(c => c.value);
    }

    function filterProducts() {
      let products = getProducts();
      const checkedCats = getCheckedValues('.cat-filter');
      const checkedBadges = getCheckedValues('.badge-filter');
      const maxPrice = +document.getElementById('priceRange').value;
      const sort = document.getElementById('sortSelect').value;

      if (checkedCats.length) products = products.filter(p => checkedCats.includes(p.category));
      ATTRIBUTE_FILTERS.forEach(({ field, className }) => {
        products = products.filter(p => matchesAttributeFilter(p, field, getCheckedValues('.' + className)));
      });
      if (checkedBadges.length) products = products.filter(p => checkedBadges.includes(p.badge));
      products = products.filter(p => p.price <= maxPrice);

      if (sort === 'price-asc') products.sort((a, b) => a.price - b.price);
      else if (sort === 'price-desc') products.sort((a, b) => b.price - a.price);
      else if (sort === 'name') products.sort((a, b) => a.name.localeCompare(b.name, 'ru'));

      document.getElementById('resultsCount').textContent = `Найдено: ${products.length}`;
      document.getElementById('catalogGrid').innerHTML = products.length
        ? products.map(p => renderProductCard(p)).join('')
        : '<div class="no-results"><div class="no-results-icon">🔍</div><p>Нет товаров по выбранным фильтрам</p></div>';
      bindAddToCartButtons(document.getElementById('catalogGrid'));
    }

    document.querySelector('.filters-sidebar').addEventListener('change', (e) => {
      if (e.target.matches('input[type="checkbox"]')) filterProducts();
    });
    document.getElementById('priceRange').addEventListener('input', (e) => {
      document.getElementById('priceLabel').textContent = `₽0 — ${formatPrice(+e.target.value)}`;
      filterProducts();
    });
    document.getElementById('sortSelect').addEventListener('change', filterProducts);
    document.getElementById('resetFilters').addEventListener('click', () => {
      document.querySelectorAll('.filters-sidebar input[type="checkbox"]').forEach(c => {
        c.checked = false;
      });
      document.getElementById('priceRange').value = 300000;
      document.getElementById('priceLabel').textContent = '₽0 — ₽300 000';
      filterProducts();
    });

    filterProducts();
  </script>
</body>
</html>
