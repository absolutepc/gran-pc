<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск — PC Market</title>
  <link rel="stylesheet" href="css/style.css">
  <style>#page-transition{position:fixed;inset:0;z-index:10000;background:#0a0e17}body.page-transition-active>:not(#page-transition){visibility:hidden}</style>
</head>
<body class="page-transition-active">
  <div id="page-transition" class="page-transition" role="status" aria-live="polite" aria-label="Загрузка">
    <div class="page-transition__inner">
      <div class="page-transition__logo"><img src="img/hero-pc.svg" alt=""></div>
      <p class="page-transition__label">Поиск</p>
      <div class="page-transition__progress" aria-hidden="true"><span class="page-transition__progress-bar"></span></div>
    </div>
  </div>
  <script src="js/transition-boot.js"></script>

  <div id="site-header"></div>

  <main>
    <div class="container search-header">
      <h1>Результаты поиска</h1>
      <p class="query-text">Запрос: <strong id="searchQuery"></strong></p>
    </div>

    <div class="container" style="padding-bottom:80px">
      <div class="products-grid" id="searchResults"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/transition.js"></script>
  <script>
    initLayout('search');

    const params = new URLSearchParams(window.location.search);
    const query = params.get('q') || '';
    document.getElementById('searchQuery').textContent = query || '(пусто)';

    const headerSearch = document.querySelector('.header-search input');
    if (headerSearch && query) headerSearch.value = query;

    const results = searchProducts(query);
    const container = document.getElementById('searchResults');

    if (results.length === 0) {
      container.innerHTML = `
        <div class="no-results" style="grid-column:1/-1">
          <div class="no-results-icon">🔍</div>
          <h2>Ничего не найдено</h2>
          <p>Попробуйте другие ключевые слова или перейдите в <a href="catalog.html" style="color:var(--accent-light)">каталог</a></p>
        </div>
      `;
    } else {
      container.innerHTML = results.map(item =>
        renderProductCard(item, item.type === 'ready-pc' ? 'ready-pc' : 'product')
      ).join('');
      bindAddToCartButtons(container);
    }
  </script>
</body>
</html>
